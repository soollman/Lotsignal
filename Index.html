<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LotSignal — Sacramento Development Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');
:root{--bg:#0e100d;--surf:#141714;--surf2:#1b1e1a;--bdr:#272b26;--grn:#b8ff57;--blu:#57c4ff;--warn:#ffb347;--red:#ff5f5f;--txt:#e6e9e4;--mut:#676b64}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;overflow:hidden}

#hdr{position:fixed;top:0;left:0;right:0;height:52px;background:var(--surf);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;padding:0 12px;z-index:1000}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--grn);letter-spacing:.04em;flex-shrink:0}
#sbox{flex:1;position:relative;min-width:0}
#sinput-wrap{display:flex;height:34px;border:1px solid var(--bdr);background:var(--surf2)}
#si{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-size:13px;padding:0 10px;min-width:0;font-family:'DM Sans',sans-serif}
#si::placeholder{color:var(--mut)}
#gobtn{background:var(--grn);border:none;color:#0e100d;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.06em;padding:0 14px;cursor:pointer;text-transform:uppercase;flex-shrink:0;height:34px}
#gobtn:active{opacity:.8}
#suggestions{position:absolute;top:36px;left:0;right:0;background:var(--surf);border:1px solid var(--bdr);border-top:none;z-index:2000;display:none;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#suggestions::-webkit-scrollbar{display:none}
.sug-item{padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--bdr)}
.sug-item:last-child{border-bottom:none}
.sug-item:active,.sug-item.hi{background:var(--surf2)}
.sug-main{font-size:13px;color:var(--txt);line-height:1.3}
.sug-sub{font-size:10px;color:var(--mut);font-family:'DM Mono',monospace;margin-top:2px}
.sug-msg{padding:12px;font-family:'DM Mono',monospace;font-size:10px;color:var(--mut);text-align:center;letter-spacing:.08em}

/* MAP: canvas for tiles, div overlay for pins */
#map{position:fixed;top:52px;left:0;right:0;bottom:0;z-index:1;overflow:hidden;background:#141a14;touch-action:none}
#mapCanvas{position:absolute;top:0;left:0;pointer-events:none}
#pinLayer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* PIN DOTS — HTML elements, never taint canvas */
.pin{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:all;cursor:pointer;transition:transform .15s}
.pin:active{transform:translate(-50%,-50%) scale(1.3)}
.pin-demo{width:14px;height:14px;background:#57c4ff;border:2px solid #0e100d;box-shadow:0 0 0 3px rgba(87,196,255,.2),0 2px 6px rgba(0,0,0,.5)}
.pin-active{width:18px;height:18px;background:#b8ff57;border:2.5px solid #fff;box-shadow:0 0 0 4px rgba(184,255,87,.25),0 2px 8px rgba(0,0,0,.5)}
.pin-search{width:16px;height:16px;background:#b8ff57;border:2.5px solid #fff;box-shadow:0 0 0 4px rgba(184,255,87,.25),0 2px 8px rgba(0,0,0,.5)}
.pin-label{position:absolute;transform:translate(-50%,-32px);background:rgba(14,16,13,.88);color:#e6e9e4;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:3px 8px;white-space:nowrap;pointer-events:none}

#panel{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--surf);border-top:2px solid var(--bdr);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1);transform:translateY(calc(100% - 52px));max-height:calc(100vh - 52px)}
#panel.peek{transform:translateY(calc(100% - 115px))}
#panel.open{transform:translateY(0)}
#phandle{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;cursor:pointer;border-bottom:1px solid var(--bdr);position:relative;user-select:none;-webkit-user-select:none}
#pbar{width:32px;height:3px;background:var(--bdr);border-radius:2px;position:absolute;top:7px;left:50%;transform:translateX(-50%)}
#ptitle{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
#paddress{font-size:13px;font-weight:600;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
#pscore{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;color:var(--mut)}
#pbody{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
#pbody::-webkit-scrollbar{display:none}

@media(min-width:700px){
  #map{right:370px}
  #panel{position:fixed;top:52px;right:0;bottom:0;left:auto;width:370px;transform:none!important;border-top:none;border-left:1px solid var(--bdr);max-height:calc(100vh - 52px)}
  #phandle{display:none}
}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 20px;text-align:center;min-height:200px}
.empty-ico{font-family:'Bebas Neue',sans-serif;font-size:52px;color:var(--bdr)}
.empty-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.empty-txt{font-size:13px;color:var(--mut);max-width:240px;line-height:1.6}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 20px}
.spin{width:26px;height:26px;border:2px solid var(--bdr);border-top-color:var(--grn);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spin-lbl{font-family:'DM Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.sblk{padding:16px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:16px}
.sring{position:relative;width:66px;height:66px;flex-shrink:0}
.sring svg{width:66px;height:66px;transform:rotate(-90deg)}
.snum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20px}
.smeta{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.sverdict{font-size:15px;font-weight:600;line-height:1.2}
.ssub{font-size:11px;color:var(--mut);margin-top:3px}
.sec{border-bottom:1px solid var(--bdr)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;cursor:pointer;user-select:none}
.shead:active{background:var(--surf2)}
.sname{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.schev{color:var(--mut);font-size:12px;transition:transform .2s;display:inline-block}
.schev.open{transform:rotate(180deg)}
.sbody{padding:0 18px 13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;padding:3px 8px;text-transform:uppercase;font-weight:500;border:1px solid}
.tg{background:rgba(184,255,87,.1);color:var(--grn);border-color:rgba(184,255,87,.25)}
.tb{background:rgba(87,196,255,.08);color:var(--blu);border-color:rgba(87,196,255,.2)}
.tw{background:rgba(255,179,71,.08);color:var(--warn);border-color:rgba(255,179,71,.2)}
.tm{background:transparent;color:var(--mut);border-color:var(--bdr)}
.elig{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.elig:last-child{border-bottom:none}
.edot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.dg{background:var(--grn);box-shadow:0 0 5px rgba(184,255,87,.5)}
.dw{background:var(--warn)}
.dm{background:var(--bdr)}
.etitle{font-size:13px;font-weight:500;margin-bottom:2px}
.edesc{font-size:11px;color:var(--mut);line-height:1.5}
.dr{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.dr:last-child{border-bottom:none}
.dl{font-family:'DM Mono',monospace;font-size:11px;color:var(--mut)}
.dv{font-family:'DM Mono',monospace;font-size:12px;color:var(--txt)}
.dv.hi{color:var(--grn)}
.civic{margin:13px 18px;padding:12px 14px;background:rgba(87,196,255,.05);border:1px solid rgba(87,196,255,.18);border-left:3px solid var(--blu)}
.clbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--blu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.ctxt{font-size:12px;color:var(--mut);line-height:1.6}
.src-live{margin:10px 18px 0;padding:8px 12px;background:rgba(184,255,87,.05);border:1px solid rgba(184,255,87,.15);font-family:'DM Mono',monospace;font-size:9px;color:rgba(184,255,87,.6);letter-spacing:.05em;line-height:1.7}
.src-est{margin:10px 18px 0;padding:8px 12px;background:rgba(255,179,71,.05);border:1px solid rgba(255,179,71,.2);font-family:'DM Mono',monospace;font-size:9px;color:var(--warn);letter-spacing:.05em;line-height:1.7}
.fnote{padding:8px 18px 24px;font-family:'DM Mono',monospace;font-size:9px;color:var(--mut);line-height:1.8}
</style>
</head>
<body>
<div id="hdr">
  <div class="logo">LOTSIGNAL</div>
  <div id="sbox">
    <div id="sinput-wrap">
      <input id="si" type="text" placeholder="Search Sacramento address…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="gobtn">GO</button>
    </div>
    <div id="suggestions"></div>
  </div>
</div>

<div id="map">
  <canvas id="mapCanvas"></canvas>
  <div id="pinLayer"></div>
</div>

<div id="panel">
  <div id="phandle">
    <div id="pbar"></div>
    <div>
      <div id="ptitle">No parcel selected</div>
      <div id="paddress">Search an address or tap a pin</div>
    </div>
    <div id="pscore">—</div>
  </div>
  <div id="pbody">
    <div class="empty">
      <div class="empty-ico">◎</div>
      <div class="empty-lbl">No parcel selected</div>
      <div class="empty-txt">Start typing a Sacramento address — suggestions appear as you type.</div>
    </div>
  </div>
</div>

<script>
// ── CANVAS TILE MAP ───────────────────────────────────────────────────────────
var mapDiv=document.getElementById('map');
var canvas=document.getElementById('mapCanvas');
var ctx=canvas.getContext('2d');
var pinLayer=document.getElementById('pinLayer');
var DPR=window.devicePixelRatio||1;
var M={cx:-121.4944,cy:38.5816,zoom:13,tiles:{}};
var dragging=false,lastX=0,lastY=0,moved=false;

function W(){return mapDiv.offsetWidth;}
function H(){return mapDiv.offsetHeight;}

function resize(){
  canvas.width=W()*DPR; canvas.height=H()*DPR;
  canvas.style.width=W()+'px'; canvas.style.height=H()+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}

function lon2x(lon){return(lon-M.cx)*(256*Math.pow(2,M.zoom))/360+W()/2;}
function lat2y(lat){
  function y(la){var s=Math.sin(la*Math.PI/180);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*Math.pow(2,M.zoom);}
  return y(lat)-y(M.cy)+H()/2;
}

function draw(){
  if(!W()||!H())return;
  ctx.fillStyle='#141a14'; ctx.fillRect(0,0,W(),H());
  var z=Math.round(M.zoom),ts=256*Math.pow(2,M.zoom-z),tc=Math.pow(2,z);
  var cxt=(M.cx+180)/360*tc,sl=Math.sin(M.cy*Math.PI/180);
  var cyt=(1-Math.log((1+sl)/(1-sl))/(2*Math.PI))/2*tc;
  var x0=W()/2-cxt*ts,y0=H()/2-cyt*ts;
  for(var tx=Math.floor(-x0/ts)-1;tx<=Math.ceil((W()-x0)/ts)+1;tx++){
    for(var ty=Math.floor(-y0/ts)-1;ty<=Math.ceil((H()-y0)/ts)+1;ty++){
      if(ty<0||ty>=tc)continue;
      var wtx=((tx%tc)+tc)%tc,key=z+'/'+wtx+'/'+ty,px=x0+tx*ts,py=y0+ty*ts;
      if(M.tiles[key]&&M.tiles[key].complete&&M.tiles[key].naturalWidth>0){
        try{ctx.drawImage(M.tiles[key],px,py,ts,ts);}catch(e){}
      }else if(!M.tiles[key]){
        var img=new Image();
        // NO crossOrigin — avoids CORS taint; tiles render fine without it for display
        img.src='https://'+['a','b','c'][Math.abs(tx+ty)%3]+'.tile.openstreetmap.org/'+key+'.png';
        img.onload=function(){draw();};
        M.tiles[key]=img;
      }
    }
  }
  ctx.fillStyle='rgba(5,10,5,0.42)'; ctx.fillRect(0,0,W(),H());
  updatePins();
}

// ── PIN LAYER (HTML divs — no canvas taint issue) ─────────────────────────────
var selLat=null,selLng=null,selId=null,searchPinEl=null;
var demoPinEls={};

function initDemoPins(){
  DEMOS.forEach(function(d){
    var el=document.createElement('div');
    el.className='pin pin-demo';
    var lbl=document.createElement('div');
    lbl.className='pin-label';
    lbl.textContent=d.label;
    el.appendChild(lbl);
    el.addEventListener('click',function(e){e.stopPropagation();loadDemo(d);});
    el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();if(!moved)loadDemo(d);});
    pinLayer.appendChild(el);
    demoPinEls[d.id]=el;
  });
}

function updatePins(){
  DEMOS.forEach(function(d){
    var el=demoPinEls[d.id];
    if(!el)return;
    var px=lon2x(d.lng),py=lat2y(d.lat);
    var onScreen=px>-30&&px<W()+30&&py>-30&&py<H()+30;
    el.style.display=onScreen?'block':'none';
    el.style.left=px+'px';
    el.style.top=py+'px';
    el.className='pin '+(d.id===selId?'pin-active':'pin-demo');
    // re-append label since className wipe removes it
    if(!el.querySelector('.pin-label')){
      var lbl=document.createElement('div');lbl.className='pin-label';lbl.textContent=d.label;el.appendChild(lbl);
    }
  });
  if(searchPinEl&&selLat!==null&&selId===null){
    searchPinEl.style.left=lon2x(selLng)+'px';
    searchPinEl.style.top=lat2y(selLat)+'px';
    searchPinEl.style.display='block';
  }else if(searchPinEl){
    searchPinEl.style.display='none';
  }
}

function setSearchPin(lat,lng){
  if(!searchPinEl){
    searchPinEl=document.createElement('div');
    searchPinEl.className='pin pin-search';
    pinLayer.appendChild(searchPinEl);
  }
  searchPinEl.style.display='block';
  searchPinEl.style.left=lon2x(lng)+'px';
  searchPinEl.style.top=lat2y(lat)+'px';
}

// ── MAP INTERACTION ───────────────────────────────────────────────────────────
mapDiv.addEventListener('mousedown',function(e){lastX=e.clientX;lastY=e.clientY;dragging=true;moved=false;mapDiv.style.cursor='grabbing';});
window.addEventListener('mouseup',function(){dragging=false;mapDiv.style.cursor='';});
window.addEventListener('mousemove',function(e){
  if(!dragging)return;
  var dx=e.clientX-lastX,dy=e.clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
  pan(dx,dy);lastX=e.clientX;lastY=e.clientY;
});
mapDiv.addEventListener('touchstart',function(e){
  if(e.touches.length===1){lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;dragging=true;moved=false;}
  else if(e.touches.length===2){_pd=dist2(e.touches);}
},{passive:true});
mapDiv.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===2){var d=dist2(e.touches);M.zoom=Math.max(10,Math.min(18,M.zoom+(d-_pd)*0.012));_pd=d;draw();return;}
  var dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
  pan(dx,dy);lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
},{passive:false});
mapDiv.addEventListener('touchend',function(){dragging=false;});
mapDiv.addEventListener('wheel',function(e){e.preventDefault();M.zoom=Math.max(10,Math.min(18,M.zoom-(e.deltaY>0?.5:-.5)));draw();},{passive:false});
var _pd=0;
function dist2(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);}
function pan(dx,dy){
  var dpp=360/(256*Math.pow(2,M.zoom));
  M.cx-=dx*dpp;
  var sl=Math.sin(M.cy*Math.PI/180);
  var wy=(0.5-Math.log((1+sl)/(1-sl))/(4*Math.PI))*256*Math.pow(2,M.zoom);
  wy-=dy*dpp*(256*Math.pow(2,M.zoom)/360);
  M.cy=Math.max(-85,Math.min(85,(2*Math.atan(Math.exp((0.5-wy/(256*Math.pow(2,M.zoom)))*2*Math.PI))-Math.PI/2)*180/Math.PI));
  draw();
}
function flyTo(lat,lng,zoom){M.cx=lng;M.cy=lat;M.zoom=zoom||16;draw();}
window.addEventListener('resize',resize);

// ── DEMO DATA ─────────────────────────────────────────────────────────────────
var DEMOS=[
  {id:'eastsac', lat:38.5650,lng:-121.4620,label:'East Sac SFR',      address:'4521 H St, Sacramento',        apn:'009-0213-004',zone:'R-1B',   lot:6250, units:1,yr:1948,lv:185000,iv:310000,la:1380},
  {id:'midtown', lat:38.5720,lng:-121.5030,label:'Midtown MF',         address:'2130 21st St, Sacramento',     apn:'007-0089-012',zone:'R-3A-SP',lot:5400, units:4,yr:1962,lv:320000,iv:480000,la:3200},
  {id:'northsac',lat:38.5890,lng:-121.4780,label:'North Sac SFR',      address:'3802 Arcade Blvd, Sacramento', apn:'225-0041-008',zone:'R-1',    lot:7800, units:1,yr:1955,lv:145000,iv:220000,la:1650},
  {id:'oakpark', lat:38.5530,lng:-121.4750,label:'Oak Park Duplex',    address:'3540 4th Ave, Sacramento',     apn:'012-0189-003',zone:'R-2',    lot:6000, units:2,yr:1938,lv:165000,iv:185000,la:1820},
  {id:'downtown',lat:38.5804,lng:-121.4934,label:'Downtown Commercial',address:'1415 L St, Sacramento',        apn:'006-0162-001',zone:'C-3-SP', lot:8200, units:0,yr:1965,lv:890000,iv:1200000,la:12000},
  {id:'landpark',lat:38.5612,lng:-121.5150,label:'Land Park SFR',      address:'1022 Vallejo Way, Sacramento', apn:'014-0231-006',zone:'R-1A',   lot:8100, units:1,yr:1942,lv:210000,iv:445000,la:1920},
];

// init after DEMOS defined
setTimeout(function(){initDemoPins();resize();},50);

// ── PROXY (for Sacramento County APIs only — NOT Nominatim) ───────────────────
function proxyFetch(url){
  return fetch('https://corsproxy.io/?'+encodeURIComponent(url))
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .catch(function(){
      return fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url))
        .then(function(r){return r.json();})
        .then(function(d){if(d&&d.contents)return JSON.parse(d.contents);throw new Error('failed');});
    });
}

// ── AUTOCOMPLETE — Nominatim called DIRECTLY (no proxy needed, allows CORS) ───
var sugEl=document.getElementById('suggestions'),sugT=null,sugI=-1,sugR=[];

document.getElementById('si').addEventListener('input',function(){
  var q=this.value.trim();clearTimeout(sugT);sugI=-1;
  if(q.length<3){hideSug();return;}
  sugEl.innerHTML='<div class="sug-msg">SEARCHING…</div>';sugEl.style.display='block';
  sugT=setTimeout(function(){fetchSug(q);},350);
});
document.getElementById('si').addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'){e.preventDefault();moveSug(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();moveSug(-1);}
  else if(e.key==='Enter'){e.preventDefault();if(sugI>=0&&sugR[sugI])pickSug(sugR[sugI]);else doSearch();}
  else if(e.key==='Escape')hideSug();
});
document.addEventListener('click',function(e){if(!document.getElementById('sbox').contains(e.target))hideSug();});

function fetchSug(q){
  // Nominatim allows direct browser calls — no proxy needed
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&viewbox=-121.9,38.0,-120.8,38.9&bounded=1&q='+encodeURIComponent(q+' Sacramento'),
    {headers:{'Accept-Language':'en-US','User-Agent':'LotSignal/1.0'}})
    .then(function(r){return r.json();})
    .then(function(res){
      if(!res||!res.length){sugEl.innerHTML='<div class="sug-msg">NO RESULTS</div>';return;}
      sugR=res;sugEl.innerHTML='';
      res.forEach(function(r){
        var a=r.address||{};
        var main=(a.house_number?a.house_number+' ':'')+(a.road||a.pedestrian||a.path||'');
        if(!main.trim())main=r.display_name.split(',')[0];
        var sub=[a.suburb||a.neighbourhood,a.city||a.town].filter(Boolean).join(', ');
        var el=document.createElement('div');
        el.className='sug-item';
        el.innerHTML='<div class="sug-main">'+esc(main)+'</div>'+(sub?'<div class="sug-sub">'+esc(sub)+'</div>':'');
        el.addEventListener('mousedown',function(e){e.preventDefault();pickSug(r);});
        el.addEventListener('touchend',function(e){e.preventDefault();pickSug(r);});
        sugEl.appendChild(el);
      });
      sugEl.style.display='block';
    })
    .catch(function(e){console.warn('Nominatim error:',e);sugEl.innerHTML='<div class="sug-msg">TRY PRESSING GO</div>';});
}

function pickSug(r){
  var a=r.address||{};
  var main=(a.house_number?a.house_number+' ':'')+(a.road||a.pedestrian||'');
  if(!main.trim())main=r.display_name.split(',')[0];
  document.getElementById('si').value=main+(a.city?', '+a.city:'');
  hideSug();
  go(parseFloat(r.lat),parseFloat(r.lon),document.getElementById('si').value);
}
function moveSug(d){
  var items=sugEl.querySelectorAll('.sug-item');if(!items.length)return;
  if(sugI>=0)items[sugI].classList.remove('hi');
  sugI=Math.max(0,Math.min(items.length-1,sugI+d));
  items[sugI].classList.add('hi');items[sugI].scrollIntoView({block:'nearest'});
}
function hideSug(){sugEl.style.display='none';sugI=-1;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

// ── SEARCH ────────────────────────────────────────────────────────────────────
document.getElementById('gobtn').addEventListener('click',doSearch);

function doSearch(){
  var q=document.getElementById('si').value.trim();if(!q)return;hideSug();
  var ql=q.toLowerCase();
  for(var i=0;i<DEMOS.length;i++){
    var d=DEMOS[i],st=d.address.split(',')[0].toLowerCase().replace(/^\d+\s*/,'');
    if(st.split(' ').some(function(w){return w.length>3&&ql.includes(w);})){loadDemo(d);return;}
  }
  showSpin('Finding address…');peekPanel();
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&viewbox=-121.9,38.0,-120.8,38.9&bounded=1&q='+encodeURIComponent(q+' Sacramento CA'),
    {headers:{'Accept-Language':'en-US'}})
    .then(function(r){return r.json();})
    .then(function(geo){
      if(!geo||!geo.length)throw new Error('not found');
      var a=geo[0].address||{};
      var addr=(a.house_number?a.house_number+' ':'')+(a.road||'')+(a.city?', '+a.city:'');
      if(!addr.trim())addr=geo[0].display_name.split(',').slice(0,2).join(',').trim();
      go(parseFloat(geo[0].lat),parseFloat(geo[0].lon),addr);
    })
    .catch(function(){showError('Address not found. Try a different address.');peekPanel();});
}

function go(lat,lng,addr){
  selId=null;selLat=lat;selLng=lng;
  setSearchPin(lat,lng);
  flyTo(lat,lng,17);
  showSpin('Fetching parcel data…');peekPanel();
  fetchParcel(lat,lng,addr)
    .then(function(r){render(r.p,rules(r.p),r.src);openPanel();})
    .catch(function(){showError('Could not load parcel data.');peekPanel();});
}

function loadDemo(d){
  hideSug();selId=d.id;selLat=d.lat;selLng=d.lng;
  if(searchPinEl)searchPinEl.style.display='none';
  flyTo(d.lat,d.lng,17);
  showSpin('Loading…');peekPanel();
  setTimeout(function(){render(d,rules(d),'demo');openPanel();},400);
}

// ── PARCEL APIs ───────────────────────────────────────────────────────────────
// Layer 22 = ALL Parcels (confirmed fields: PARCEL_NUMBER, APN_DASH, LOTSIZE, ZONE_, LANDUSE, NAME, JURISDICTION)
// Layer 0  = legacy/display only — skip
// ASSESSOR layer 0 = scanned maps only, no queryable data — skip
// ASSESSOR layer 1 = Sales by Property Type — queryable, has NET_VALUE, SALE_PRICE
// Zoning layer 3 = confirmed fields: ZONE, BASE_ZONE, PUDNAME, SPDNAME, TYPE
var PA_URL='https://mapservices.gis.saccounty.net/arcgis/rest/services/PARCELS/MapServer/22/query';
var SA_URL='https://mapservices.gis.saccounty.net/arcgis/rest/services/ASSESSOR/MapServer/1/query';
var ZO_URL='https://mapservices.gis.saccounty.net/arcgis/rest/services/CITY_of_SACRAMENTO/MapServer/3/query';

function fetchParcel(lat,lng,addr){
  // Use a small bounding box instead of a point — more reliable with State Plane servers
  var d=0.0003; // ~30m buffer
  var bbox=(lng-d)+','+(lat-d)+','+(lng+d)+','+(lat+d);
  var qs='geometry='+bbox
    +'&geometryType=esriGeometryEnvelope'
    +'&inSR=4326&outSR=4326'
    +'&spatialRel=esriSpatialRelIntersects'
    +'&outFields=*&returnGeometry=false&f=json';

  return Promise.all([
    proxyFetch(PA_URL+'?'+qs).catch(function(){return null;}),
    proxyFetch(SA_URL+'?'+qs).catch(function(){return null;}),
    proxyFetch(ZO_URL+'?'+qs).catch(function(){return null;})
  ]).then(function(res){
    var Praw=res[0], Sraw=res[1], Zraw=res[2];
    var P=Praw&&Praw.features&&Praw.features[0]?Praw.features[0].attributes:{};
    var S=Sraw&&Sraw.features&&Sraw.features[0]?Sraw.features[0].attributes:{};
    var Z=Zraw&&Zraw.features&&Zraw.features[0]?Zraw.features[0].attributes:{};

    window._dbg={
      P_keys:Object.keys(P).filter(function(k){return P[k]!=null&&P[k]!=='';}),
      S_keys:Object.keys(S).filter(function(k){return S[k]!=null&&S[k]!=='';}),
      Z_keys:Object.keys(Z).filter(function(k){return Z[k]!=null&&Z[k]!=='';}),
      P:P,S:S,Z:Z,
      P_count:Praw&&Praw.features?Praw.features.length:0,
      S_count:Sraw&&Sraw.features?Sraw.features.length:0,
      Z_count:Zraw&&Zraw.features?Zraw.features.length:0,
      P_err:Praw&&Praw.error?JSON.stringify(Praw.error):'',
      S_err:Sraw&&Sraw.error?JSON.stringify(Sraw.error):'',
      Z_err:Zraw&&Zraw.error?JSON.stringify(Zraw.error):''
    };

    var apn  = P.APN_DASH || P.PARCEL_NUMBER || P.APN10 || '—';
    var lot  = fl(P.LOTSIZE);
    var zone = Z.ZONE || Z.BASE_ZONE || P.ZONE_ || '—';
    var lv   = fl(S.NET_VALUE || S.LAND_VALUE || S.SALE_PRICE);
    var iv   = fl(S.IMPROVEMENT_VALUE || S.IMP_VALUE);
    var yr   = parseInt(S.YEAR_BUILT || S.YR_BLT) || 0;
    var la   = fl(S.LIVING_AREA || S.BLDG_SQFT || S.SQ_FEET);
    var units= parseInt(P.UNITS || S.UNITS || S.NO_UNITS) || 1;

    if(lot>0 && lot<200) lot = Math.round(lot*43560);
    if(!lot && P['SHAPE.STArea()']>0) lot = Math.round(P['SHAPE.STArea()']);

    var hasData=(apn!=='—'||lot>0||zone!=='—');
    return{p:{address:addr,apn:apn,zone:zone,lot:lot,units:units,yr:yr,lv:lv,iv:iv,la:la},
      src:hasData?'live':'no-data'};
  });
}
function fl(v){return parseFloat(v)||0;}

// ── RULES ─────────────────────────────────────────────────────────────────────
function rules(p){
  var lot=p.lot||0,z=(p.zone||'').toUpperCase(),u=p.units||1;
  var sfr=/^R-1|^RE|^RN/.test(z)||z==='R-1'||z==='R-1B'||z==='R-1A';
  var mf=/^R-2|^R-3|^R-4|^RM|^RDA/.test(z),res=sfr||mf||/^R-/.test(z);
  var sb9=sfr&&lot>=2400&&u<=1,adu=res&&lot>=1200,jadu=sfr&&adu;
  var db=mf||(res&&lot>=6000),mfr=mf,mm=/^R-2|^RMX/.test(z)&&lot>=4000;
  var max=u;
  if(sb9)max=Math.max(max,4);if(adu)max=Math.max(max,u+(jadu?2:1));
  if(mf&&lot>0)max=Math.max(max,Math.floor(lot/600));
  var sc=15;if(sb9)sc+=28;if(adu)sc+=18;if(db)sc+=14;if(mfr)sc+=20;
  if(lot>7500)sc+=8;if(lot>15000)sc+=8;sc=Math.min(sc,97);
  return{sc:sc,sb9:sb9,adu:adu,jadu:jadu,db:db,mfr:mfr,mm:mm,max:max,
    bld:Math.round(lot*(mf?1.5:sfr?.45:.8)),sfr:sfr,mf:mf,res:res};
}

// ── PANEL ─────────────────────────────────────────────────────────────────────
var panel=document.getElementById('panel'),po=false;
document.getElementById('phandle').onclick=function(){po=!po;panel.className='panel '+(po?'open':'peek');};
function openPanel(){po=true;panel.className='panel open';}
function peekPanel(){po=false;panel.className='panel peek';}
function setHdr(t,a,s,c){
  document.getElementById('ptitle').textContent=t;
  document.getElementById('paddress').textContent=a;
  document.getElementById('pscore').textContent=s;
  document.getElementById('pscore').style.color=c||'var(--mut)';
}
function showSpin(msg){
  document.getElementById('pbody').innerHTML='<div class="spin-wrap"><div class="spin"></div><div class="spin-lbl">'+msg+'</div></div>';
  setHdr('Analyzing…',msg,'—',null);
}
function showError(msg){
  document.getElementById('pbody').innerHTML='<div class="empty"><div class="empty-ico" style="color:var(--red)">⚠</div><div class="empty-lbl" style="color:var(--red)">Not Found</div><div class="empty-txt">'+msg+'</div></div>';
  setHdr('Not found','Try a different address','—',null);
}
function tog(id){var b=document.getElementById('b'+id),c=document.getElementById('c'+id);var o=b.style.display==='none';b.style.display=o?'block':'none';c.classList.toggle('open',o);}
function sec(t,b,id){return'<div class="sec"><div class="shead" onclick="tog(\''+id+'\')"><span class="sname">'+t+'</span><span class="schev open" id="c'+id+'">▾</span></div><div class="sbody" id="b'+id+'">'+b+'</div></div>';}
function dr(l,v,hi){return'<div class="dr"><span class="dl">'+l+'</span><span class="dv'+(hi?' hi':'')+'">'+v+'</span></div>';}
function ei(dot,t,d){return'<div class="elig"><div class="edot '+dot+'"></div><div><div class="etitle">'+t+'</div><div class="edesc">'+d+'</div></div></div>';}

function render(p,a,src){
  var col=a.sc>=70?'#b8ff57':a.sc>=45?'#ffb347':'#ff5f5f';
  var verd=a.sc>=75?'Strong Potential':a.sc>=55?'Moderate Potential':a.sc>=35?'Limited Potential':'Low Potential';
  setHdr('Parcel Analysis',p.address,a.sc,col);
  var C=2*Math.PI*27,dash=(a.sc/100)*C;
  var tags='';
  if(a.sb9)tags+='<span class="tag tg">SB 9 Eligible</span>';
  if(a.adu)tags+='<span class="tag tg">ADU</span>';
  if(a.jadu)tags+='<span class="tag tg">Jr ADU</span>';
  if(a.db)tags+='<span class="tag tb">Density Bonus</span>';
  if(a.mfr)tags+='<span class="tag tb">MF By-Right</span>';
  if(a.mm)tags+='<span class="tag tw">Missing Middle</span>';
  if(!a.res)tags+='<span class="tag tm">Non-Residential</span>';
  if(!tags)tags='<span class="tag tm">Review Required</span>';
  var elig=
    ei(a.sb9?'dg':'dm','SB 9 — '+(a.sb9?'Eligible':'Not Eligible'),a.sb9?'Lot split + duplex by right. Up to 4 units, no discretionary approval.':'Requires SFR zone, ≥2,400 sqft lot, ≤1 existing unit.')+
    ei(a.adu?'dg':'dm','ADU — '+(a.adu?'Eligible':'Not Eligible'),a.adu?'Detached or attached ADU permitted.'+(a.jadu?' Junior ADU also allowed.':''):'Min 1,200 sqft lot required.')+
    ei(a.db?'dg':'dm','Density Bonus — '+(a.db?'Applicable':'Review Required'),a.db?'Up to 50% density increase with affordable unit (CA Gov Code 65915).':'Base zone may not support density bonus.')+
    ei(a.mfr?'dg':a.mm?'dw':'dm','Multifamily By-Right — '+(a.mfr?'Yes':'No'),a.mfr?'Multifamily permitted as of right.':a.mm?'Missing-middle types may be allowed — verify zoning code.':'Requires entitlement or rezoning.');
  var lot=p.lot>0?p.lot.toLocaleString()+' sqft':'—';
  var bld=a.bld>0?'~'+a.bld.toLocaleString()+' sqft':'—';
  var lv=p.lv>0?'$'+p.lv.toLocaleString():'—';
  var tv=(p.lv+p.iv)>0?'$'+(p.lv+p.iv).toLocaleString():'—';
  var la=p.la>0?p.la.toLocaleString()+' sqft':'—';
  var civic=a.sb9?'This lot may qualify for an SB 9 lot split — up to 4 units where 1 exists today, no discretionary approval required.':
    a.adu?'This lot may be eligible for an ADU or Junior ADU — a path to rental income without full redevelopment.':
    'Limited by-right options. An architect or planner can assess entitlement pathways.';
  var srcHtml=src==='demo'?'<div class="src-live">✓ DEMO DATA · Hardcoded real Sacramento parcel</div>':
    src==='live'?'<div class="src-live">✓ LIVE DATA · Sacramento County Assessor + GIS + Zoning</div>':
    '<div class="src-est">⚠ PARCEL API NOT REACHED · Check connection and try again</div>';

  // Debug section — shows raw API fields so we can fix mappings
  var dbgHtml='';
  if(src!=='demo' && window._dbg){
    var d=window._dbg;
    var pFields=d.P_keys.map(function(k){return k+'='+JSON.stringify(d.P[k]);}).join('\n');
    var sFields=d.S_keys.map(function(k){return k+'='+JSON.stringify(d.S[k]);}).join('\n');
    var zFields=d.Z_keys.map(function(k){return k+'='+JSON.stringify(d.Z[k]);}).join('\n');
    dbgHtml='<div style="margin:10px 18px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid var(--bdr)">'
      +'<div style="font-family:DM Mono,monospace;font-size:9px;color:var(--mut);letter-spacing:.08em;margin-bottom:6px">▸ RAW API DEBUG ('+d.P_count+' parcel feat, '+d.S_count+' sales feat, '+d.Z_count+' zone feat)</div>'
      +'<div style="font-family:DM Mono,monospace;font-size:8px;color:#57c4ff;white-space:pre-wrap;line-height:1.6;word-break:break-all">'
      +(d.P_err?'PARCELS ERROR: '+d.P_err+'\n\n':'')
      +(d.S_err?'SALES ERROR: '+d.S_err+'\n\n':'')
      +(d.Z_err?'ZONING ERROR: '+d.Z_err+'\n\n':'')
      +(pFields?'PARCELS:\n'+pFields+'\n\n':'PARCELS: no features\n\n')
      +(sFields?'SALES:\n'+sFields+'\n\n':'SALES: no features\n\n')
      +(zFields?'ZONING:\n'+zFields:'ZONING: no features')
      +'</div></div>';
  }
  document.getElementById('pbody').innerHTML=
    '<div class="sblk"><div class="sring"><svg viewBox="0 0 68 68">'+
    '<circle cx="34" cy="34" r="27" fill="none" stroke="var(--bdr)" stroke-width="5"/>'+
    '<circle cx="34" cy="34" r="27" fill="none" stroke="'+col+'" stroke-width="5" stroke-linecap="butt" stroke-dasharray="'+dash+' '+C+'"/>'+
    '</svg><div class="snum" style="color:'+col+'">'+a.sc+'</div></div>'+
    '<div><div class="smeta">Development Score</div><div class="sverdict" style="color:'+col+'">'+verd+'</div>'+
    '<div class="ssub">'+p.zone+' · APN: '+p.apn+'</div></div></div>'+
    sec('Opportunities','<div class="tags">'+tags+'</div>'+elig,'opp')+
    sec('Physical & Zoning',dr('Zoning',p.zone||'—',true)+dr('Lot Size',lot)+dr('Existing Units',p.units||'—')+dr('Year Built',p.yr||'—')+dr('Living Area',la),'phys')+
    sec('Financial Signals',dr('Est. Max Units',a.max>1?'Up to '+a.max:'1 unit',true)+dr('Est. Buildable',bld)+dr('Assessed Land',lv)+dr('Total Assessed',tv),'fin')+
    '<div class="civic"><div class="clbl">Homeowner Note</div><div class="ctxt">'+civic+'</div></div>'+
    srcHtml+'<div class="fnote">Screening only — verify with local jurisdiction before acting on this analysis.</div>'+dbgHtml;
}
</script>
</body>
